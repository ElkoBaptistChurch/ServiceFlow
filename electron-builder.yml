appId: com.serviceflow.app
productName: ServiceFlow
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
# The bundled Bibles (resources/bibles/*.json) ship outside app.asar and are read by
# src/main/content/bundledBibles.ts from <resourcesPath>/bibles.
extraResources:
  - from: resources/bibles
    to: bibles
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
    - portable
  artifactName: '${productName}-Setup-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: '${productName}-${version}.${ext}'
